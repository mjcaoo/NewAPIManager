<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>New API Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div>
      <h1>New API Manager</h1>
      <p>Windows 本地核心、数据、日志、备份与升级管理</p>
    </div>
    <span id="statusBadge" class="badge stopped">已停止</span>
  </header>

  <main>
    <section class="card hero">
      <div>
        <div class="eyebrow">核心服务</div>
        <h2 id="serviceUrl">http://127.0.0.1:3000</h2>
        <p id="serviceMeta">PID：—　版本：未安装</p>
      </div>
      <div class="actions">
        <button id="startButton" class="primary">启动</button>
        <button id="stopButton">停止</button>
        <button id="restartButton">重启</button>
        <button id="consoleButton">打开控制台</button>
      </div>
    </section>

    <div class="grid two">
      <section class="card">
        <div class="section-title">
          <h3>核心安装与升级</h3>
          <button id="importButton" class="small">导入 new-api.exe</button>
        </div>
        <p id="updateInfo" class="muted">可在线检查 QuantumNous/new-api 的 Windows 版本。</p>
        <div class="actions">
          <button id="checkUpdateButton">检查更新</button>
          <button id="installUpdateButton" class="primary" disabled>下载并升级</button>
        </div>
        <div id="progressWrap" class="progress-wrap hidden">
          <progress id="progress" max="100"></progress>
          <span id="progressText">正在下载…</span>
        </div>
      </section>

      <section class="card">
        <div class="section-title"><h3>数据维护</h3></div>
        <p class="muted">备份时会短暂停止核心，复制数据库与配置后自动恢复运行。</p>
        <div class="actions">
          <button id="backupButton">立即备份</button>
          <button data-open="data">数据目录</button>
          <button data-open="backups">备份目录</button>
          <button data-open="logs">日志目录</button>
        </div>
      </section>
    </div>

    <div class="grid two">
      <section class="card">
        <div class="section-title"><h3>运行设置</h3></div>
        <label>端口<input id="portInput" type="number" min="1" max="65535"></label>
        <label class="checkbox"><input id="autoStartCore" type="checkbox"> 启动管理器时自动启动 New API</label>
        <label class="checkbox"><input id="startMinimized" type="checkbox"> 启动后直接隐藏到通知区域</label>
        <label class="checkbox"><input id="runAtLogin" type="checkbox"> Windows 登录后启动管理器</label>
        <label class="checkbox"><input id="includePrereleases" type="checkbox"> 升级时允许预发布版本</label>
        <div class="actions"><button id="saveSettingsButton" class="primary">保存设置</button></div>
      </section>

      <section class="card">
        <div class="section-title"><h3>目录布局</h3></div>
        <dl id="pathsList"></dl>
        <div class="actions">
          <button data-open="root">安装目录</button>
          <button data-open="config">配置目录</button>
          <button data-open="core">核心目录</button>
        </div>
      </section>
    </div>

    <section class="card logs">
      <div class="section-title">
        <h3>实时日志</h3>
        <button id="clearLogsButton" class="small">清空显示</button>
      </div>
      <pre id="logOutput">等待核心输出…</pre>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
